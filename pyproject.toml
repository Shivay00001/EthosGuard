[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ethosguard"
version = "7.0.0"
authors = [
  { name="VisionQuantech", email="opensource@visionquantech.com" },
]
description = "The Ultimate ASI Safety Platform - Predictive ML, Formal Verification, and Evolutionary Defenses."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "z3-solver>=4.12.2",
]

[tool.setuptools]
packages = ["ethosguard"]

[project.urls]
"Homepage" = "https://github.com/VisionQuantech/EthosGuard"
"Bug Tracker" = "https://github.com/VisionQuantech/EthosGuard/issues"
